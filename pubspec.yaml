name: matontine
description: Application mobile de gestion de tontines multi-types
publish_to: 'none'
version: 1.0.0+1

environment:
  # >=3.3.0 requis pour les `extension type` (voir
  # pwa_install_service_web.dart) — cette syntaxe existait avant en tant
  # qu'expérimentation "inline-class" derrière un flag, stabilisée dans
  # Dart 3.3. Sans ce minimum, le compilateur utilise la version de langage
  # la plus basse autorisée (3.0) et refuse la syntaxe, même si le SDK
  # installé est plus récent.
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Web — URLs propres sans "#" (nécessite la config Netlify de redirection
  # SPA, voir netlify.toml)
  flutter_web_plugins:
    sdk: flutter
  # Remplace dart:html/dart:js_util (dépréciés, et dart:js_util a fini par
  # ne plus être résolu du tout sur les SDK Dart récents — voir
  # pwa_install_service_web.dart). Déjà présent en dépendance transitive via
  # firebase_core_web/dio_web_adapter (résolu en 15.2.0 dans ce projet) —
  # volontairement SANS contrainte de version fixe ici pour ne pas entrer en
  # conflit avec cette résolution transitive existante.
  web: any

  # HTTP / API
  dio: ^5.4.3

  # Storage local
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.1
  firebase_crashlytics: ^3.5.7
  flutter_local_notifications: ^17.2.4

  # UI / Design
  shimmer: ^3.0.0
  pin_code_fields: ^8.0.1
  intl: ^0.19.0
  url_launcher: ^6.2.5

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  # Icône "legacy" (pré-Android 8) — motif sur fond blanc
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  # Icône adaptative (Android 8+) — calque de fond uni + calque de motif
  # séparé, recomposés par le launcher (permet les formes rondes/carrées/
  # squircle selon le téléphone, sans le motif rogné n'importe comment).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/ic_launcher_foreground.png"
  # Icône "thémée" Android 13+ (Material You — monochrome, teintée par le
  # fond d'écran de l'utilisateur). Réutilise le même motif ; Android
  # applique lui-même la teinte.
  adaptive_icon_monochrome: "assets/icons/ic_launcher_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700