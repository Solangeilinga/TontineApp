name: matontine
description: Application mobile de gestion de tontines multi-types
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP / API
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Storage local
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Firebase
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.1
  flutter_local_notifications: ^17.2.4

  # UI / Design
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.0.0
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.2.5

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/