<!DOCTYPE html>
<html>
<head>
  <!--
    Si l'app est servie depuis un sous-chemin (pas la racine du domaine),
    changer la valeur ci-dessous. Doit commencer et finir par "/".
    Remplacé automatiquement par --base-href au moment du build si fourni.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="MaTontine — gérez vos tontines facilement : cotisations, tours, membres, rappels.">

  <!-- Android / Chrome -->
  <meta name="theme-color" content="#1B6B3A">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS Safari — nécessaire pour "Ajouter à l'écran d'accueil" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- Note: "black" (opaque) plutôt que "black-translucent" — ce dernier
       nécessite une gestion précise du safe-area (viewport-fit=cover +
       paddings CSS) pour éviter que le contenu ne passe SOUS la barre de
       statut. Je n'ai pas pu vérifier visuellement le rendu ici (pas
       d'environnement iOS/Safari disponible) — reste sur "black" tant que
       ce n'est pas testé sur un vrai iPhone. -->
  <meta name="apple-mobile-web-app-title" content="MaTontine">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MaTontine</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
