# netlify.toml — à la racine du repo Flutter (à côté de pubspec.yaml)
#
# Netlify n'a pas le SDK Flutter préinstallé : la build_command l'installe
# elle-même (clone officiel, canal stable) avant de builder. Ça ralentit un
# peu chaque build (~2-3 min pour cloner Flutter), mais évite de dépendre
# d'un plugin Netlify tiers non maintenu par Google/Flutter.

[build]
  command = """
    git clone https://github.com/flutter/flutter.git -b stable --depth 1 && \
    export PATH="$PATH:$PWD/flutter/bin" && \
    flutter doctor && \
    flutter pub get && \
    flutter build web --release
  """
  publish = "build/web"

# Redirection SPA — indispensable avec usePathUrlStrategy() (URLs sans #).
# Sans ça, ouvrir un lien direct comme /gerant/home (ou rafraîchir la page
# dessus) renverrait un 404 Netlify, car ce chemin n'existe pas comme
# fichier réel : c'est go_router qui le gère côté client, une fois
# index.html chargé.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache long sur les assets versionnés par Flutter (contiennent un hash
# dans leur nom), cache court sur index.html pour que les mises à jour de
# l'app soient visibles rapidement sans que l'utilisateur ait à vider son
# cache manuellement.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
